[project]
name = "ship-risk-api"
version = "0.1.0"
description = "Ship Detention Early Warning System - API and risk engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.41,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "mlflow>=2.19,<3",
    "ragwire[openai,google,fastembed]==1.6.1",
    "langsmith>=0.3",
    "chainlit==2.12.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
notebook = ["jupyter>=1.1", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
    "qdrant: needs a Qdrant server (QDRANT_TEST_URL, default http://localhost:56333)",
]
